<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>線上問卷系統｜新竹社會創新基地</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="logo-mark.svg">
<link rel="stylesheet" href="style.css?v=20261124d">
<style>
  .qrbox{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
  .qrbox .qr{width:min(260px,70vw);background:#fff;padding:14px;border-radius:12px;border:1px solid var(--line)}
  .qrbox .qr svg{display:block;width:100%;height:auto}
  .resp td.wrapc{white-space:pre-line;min-width:260px}
  details.panel>summary{cursor:pointer;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">HSINCHU SOCIAL INNOVATION HUB</div>
  </header>
  <main>
    <div class="hero">
      <h1>線上<em>問卷</em>系統</h1>
      <p>建立問卷、產生連結與 QR Code、查看統計結果。民眾、進駐團隊、內部都能用。</p>
    </div>
    <section id="body"></section>
  </main>
</div>

<dialog id="dlg" aria-labelledby="dlg-title"><div class="dlg" id="dlg-body"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="common.js"></script>
<script src="qrcode.js"></script>
<script>
(function () {
  "use strict";
  var $ = U.$, esc = U.esc;
  var S = { token: "", forms: [], fbs: [], surveyTpls: [], loaded: false, pick: "", aud: "", busy: false, charts: {} };
  try { S.token = sessionStorage.getItem("must-admin") || ""; S.email = sessionStorage.getItem("must-admin-email") || ""; } catch (e) {}
  S.cfg = null; // 登入方式（Google 或密碼），向後端問一次；和報名管理後台共用同一組帳號
  var AUD = ["民眾", "進駐團隊", "內部"];

  /* ---------- Google 帳號登入 ---------- */
  function loadLoginCfg() {
    U.api("loginConfig").then(function (j) { S.cfg = { clientId: j.clientId || "", password: !!j.password }; })
      .catch(function () { S.cfg = { clientId: "", password: true }; }) // 舊版後端：沿用密碼登入
      .then(function () { if (!S.token) render(); });
  }
  function gsiReady(cb) {
    if (window.google && google.accounts && google.accounts.id) return cb();
    var old = document.getElementById("gsi-js");
    if (old) { old.addEventListener("load", cb); return; }
    var sc = document.createElement("script");
    sc.id = "gsi-js"; sc.src = "https://accounts.google.com/gsi/client"; sc.async = true;
    sc.onload = cb;
    sc.onerror = function () { var m = $("gsi-msg"); if (m) m.textContent = "Google 登入元件載入失敗，請檢查網路後重新整理。"; };
    document.head.appendChild(sc);
  }
  function showGoogleBtn() {
    gsiReady(function () {
      var box = $("gsi-btn");
      if (!box) return;
      google.accounts.id.initialize({ client_id: S.cfg.clientId, callback: onGoogleCredential, ux_mode: "popup", auto_select: false });
      google.accounts.id.renderButton(box, { theme: "outline", size: "large", text: "signin_with", shape: "pill", locale: "zh-TW", width: 280 });
    });
  }
  function onGoogleCredential(resp) {
    if (S.busy) return; S.busy = true;
    var m = $("gsi-msg"); if (m) m.textContent = "驗證中…";
    U.api("googleLogin", { credential: resp.credential }).then(function (j) {
      S.token = j.token; S.email = j.email || "";
      try { sessionStorage.setItem("must-admin", S.token); sessionStorage.setItem("must-admin-email", S.email); } catch (x) {}
      render(); return load();
    }).catch(function (x) { if (m) m.textContent = ""; U.toast(x.message); }).then(function () { S.busy = false; });
  }


  function actById(id) { for (var i = 0; i < S.forms.length; i++) if (S.forms[i].id === id) return S.forms[i]; return null; }
  function fbFor(id) { return S.fbs.filter(function (f) { return f.formId === id; }).sort(function (a, b) { return (a.createdAt || "") < (b.createdAt || "") ? -1 : 1; }); }
  function stText(f) { return f.open ? "開放中" : f.status === "closed" ? "已關閉" : "已截止"; }
  function formLink(id) { return new URL("survey.html", location.href).href + "?id=" + encodeURIComponent(id); }

  /* ---------- 回饋問卷編輯器 ---------- */
  var QT = { single: "單選題", multi: "複選題", matrix: "評分表（多個項目用同一組選項評分）", text: "文字填答", slider: "拉桿（數字範圍）", note: "說明文字（不是題目）" };
  var SCALE5 = ["非常滿意", "滿意", "普通", "不滿意", "非常不滿意"];
  function rid(p) { return p + Math.random().toString(36).slice(2, 8); }
  function newItem(type) {
    var it = { id: rid(type === "note" ? "n" : "q"), type: type, title: "", required: type !== "text" && type !== "note" };
    if (type === "single" || type === "multi") it.options = ["選項 1", "選項 2"];
    if (type === "multi") { it.minSel = 1; it.maxSel = 2; }
    if (type === "matrix") { it.options = SCALE5.slice(); it.rows = [{ id: rid("r"), label: "項目 1" }]; }
    if (type === "slider") { it.min = 0; it.max = 100; }
    if (type === "note") it.text = "";
    return it;
  }
  function lines(v) { return String(v || "").split("\n").map(function (x) { return x.trim(); }).filter(Boolean); }
  /* 把畫面上的輸入值寫回 S.ed.sv（只在需要時呼叫，避免打字時重畫） */
  function edSync() {
    var form = $("sv-form"); if (!form || !S.ed) return;
    var sv = S.ed.sv;
    sv.title = $("sv-title").value.trim(); sv.intro = $("sv-intro").value;
    form.querySelectorAll("[data-i]").forEach(function (card) {
      var it = sv.items[+card.dataset.i]; if (!it) return;
      var get = function (k) { var el = card.querySelector('[data-qf="' + k + '"]'); return el ? (el.type === "checkbox" ? el.checked : el.value) : undefined; };
      if (it.type === "note") { it.text = get("text"); return; }
      it.title = get("title").trim(); it.required = get("required");
      if (it.type === "single" || it.type === "multi" || it.type === "matrix") it.options = lines(get("options"));
      if (it.type === "multi") { it.minSel = parseInt(get("minSel"), 10) || 1; it.maxSel = parseInt(get("maxSel"), 10) || it.options.length; }
      if (it.type === "matrix") it.rows = lines(get("rows")).map(function (label, k) { return { id: (it.rows[k] && it.rows[k].id) || rid("r"), label: label }; });
      if (it.type === "slider") { it.min = parseInt(get("min"), 10) || 0; it.max = parseInt(get("max"), 10); }
    });
  }
  function edSyncAll() {
    edSync();
    if (!S.ed || !$("sv-aud")) return;
    S.ed.form.audience = $("sv-aud").value; S.ed.form.status = $("sv-status").value; S.ed.form.deadline = $("sv-deadline").value;
  }
  function renderSurvey(focusIdx) {
    var fm = S.ed.form, sv = S.ed.sv, nfb = fm.id ? fbFor(fm.id).length : 0, n = 0;
    var tf = function (k, label, val, extra) { return '<label class="f"><span>' + label + '</span><input type="text" data-qf="' + k + '" value="' + esc(val == null ? "" : val) + '"' + (extra || "") + "></label>"; };
    var ta = function (k, label, val, rows) { return '<label class="f"><span>' + label + '</span><textarea data-qf="' + k + '" rows="' + (rows || 4) + '">' + esc(val) + "</textarea></label>"; };
    var num = function (k, label, val) { return '<label class="f"><span>' + label + '</span><input type="number" data-qf="' + k + '" value="' + esc(val) + '"></label>'; };
    var h = U.head(fm.id ? "編輯問卷" : "新增問卷") + '<form id="sv-form" class="survey" novalidate>' +
      (nfb ? '<div class="warn">這份問卷已經收到 ' + nfb + " 份回覆。修改後舊的回答都會保留，但刪除或改過的題目，舊回答可能對不上。</div>" : "") +
      '<div class="f"><span>套用問卷範本（會取代下面全部題目）</span><div class="row"><select id="sv-tpl" style="flex:1 1 200px"><option value="">選擇範本…</option><option value="__default">預設：課程滿意度調查</option>' +
      S.surveyTpls.map(function (x) { return '<option value="' + esc(x.id) + '">' + esc(x.name) + "</option>"; }).join("") +
      '</select><button class="btn ghost sm" type="button" data-svapply>套用</button><button class="btn danger sm" type="button" data-svdeltpl>刪除範本</button></div></div>' +
      '<div class="grid2"><label class="f" for="sv-aud"><span>給誰填</span><select id="sv-aud">' + AUD.map(function (x) { return '<option' + (fm.audience === x ? " selected" : "") + ">" + x + "</option>"; }).join("") + "</select></label>" +
      '<label class="f" for="sv-status"><span>狀態</span><select id="sv-status"><option value="open"' + (fm.status !== "closed" ? " selected" : "") + '>開放填寫</option><option value="closed"' + (fm.status === "closed" ? " selected" : "") + ">關閉</option></select></label></div>" +
      '<label class="f" for="sv-deadline"><span>截止日期（可不填；這天過後自動關閉）</span><input type="date" id="sv-deadline" value="' + esc(fm.deadline || "") + '"></label>' +
      '<label class="f" for="sv-title"><span>問卷標題 <i>*</i></span><input type="text" id="sv-title" maxlength="100" value="' + esc(sv.title) + '"></label>' +
      '<label class="f" for="sv-intro"><span>問卷說明（顯示在題目上方）</span><textarea id="sv-intro" rows="3" maxlength="2000">' + esc(sv.intro || "") + "</textarea></label>";
    sv.items.forEach(function (it, i) {
      var label = it.type === "note" ? "說明文字" : "第 " + (++n) + " 題";
      h += '<div class="qcard" data-i="' + i + '"><div class="qhead"><b>' + label + "</b><span class=\"cnt\">" + QT[it.type] + "</span>" +
        '<span class="qtools"><button class="btn ghost sm" type="button" data-qmove="-1" aria-label="上移"' + (i ? "" : " disabled") + ">↑</button>" +
        '<button class="btn ghost sm" type="button" data-qmove="1" aria-label="下移"' + (i < sv.items.length - 1 ? "" : " disabled") + ">↓</button>" +
        '<button class="btn danger sm" type="button" data-qdel>刪除</button></span></div>';
      if (it.type === "note") h += ta("text", "說明內容", it.text, 3);
      else {
        h += tf("title", "題目", it.title, ' maxlength="200"') +
          '<label class="chk"><input type="checkbox" data-qf="required"' + (it.required ? " checked" : "") + "> 必填</label>";
        if (it.type === "single" || it.type === "multi") h += ta("options", "選項（一行一個）", (it.options || []).join("\n"), Math.min(10, (it.options || []).length + 1));
        if (it.type === "multi") h += '<div class="grid2">' + num("minSel", "最少選幾項", it.minSel) + num("maxSel", "最多選幾項", it.maxSel) + "</div>";
        if (it.type === "matrix") h += ta("rows", "評分項目（一行一個）", (it.rows || []).map(function (r) { return r.label; }).join("\n"), Math.min(8, (it.rows || []).length + 1)) +
          ta("options", "評分選項（一行一個，第一個分數最高）", (it.options || []).join("\n"), Math.min(8, (it.options || []).length + 1));
        if (it.type === "slider") h += '<div class="grid2">' + num("min", "最小值", it.min) + num("max", "最大值", it.max) + "</div>";
      }
      h += "</div>";
    });
    h += '<div class="f"><span>新增題目</span><div class="row">' + Object.keys(QT).map(function (k) { return '<button class="btn ghost sm" type="button" data-qadd="' + k + '">＋ ' + QT[k].replace(/（.*）/, "") + "</button>"; }).join("") + "</div></div>" +
      '<div class="row"><input type="text" id="sv-tplname" maxlength="40" placeholder="範本名稱，例如：工作坊回饋" aria-label="範本名稱" style="flex:1 1 200px"><button class="btn ghost sm" type="button" data-svtpl>另存為問卷範本</button></div>' +
      '<div class="row"><button class="btn" type="button" data-svsave>儲存問卷</button><button class="btn ghost" type="button" data-close>取消</button></div></form>';
    U.showDlg(h);
    if (focusIdx != null) { var c = document.querySelector('[data-i="' + focusIdx + '"]'); if (c) { c.scrollIntoView({ block: "center" }); var inp = c.querySelector("input,textarea"); if (inp) inp.focus(); } }
  }
  function openEdit(id, dup) {
    var f = actById(id);
    if (f && !dup) S.ed = { form: { id: f.id, audience: f.audience, status: f.status, deadline: f.deadline }, sv: JSON.parse(JSON.stringify(f.survey)) };
    else if (f) { var c = JSON.parse(JSON.stringify(f.survey)); c.title = c.title + "（複製）"; S.ed = { form: { audience: f.audience, status: "open", deadline: "" }, sv: c }; }
    else S.ed = { form: { audience: S.aud || "民眾", status: "open", deadline: "" }, sv: { title: "", intro: "", items: [newItem("single")] } };
    renderSurvey();
  }
  function svCall(p, okMsg, reopen, after) {
    if (S.busy) return;
    S.busy = true;
    var keep = S.ed;
    p.then(function (j) {
      U.toast(okMsg);
      return load().then(function () {
        if (reopen && keep) { S.ed = keep; renderSurvey(); }
        else { U.closeDlg(); if (after) after(j); }
      });
    }).catch(function (e) { if (e.code !== "auth") U.toast(e.message); })
      .then(function () { S.busy = false; });
  }
  document.addEventListener("change", function (e) {
    if (!S.ed || !e.target.closest || !e.target.closest("#sv-form")) return;
    if (e.target.dataset.qf === "required") edSync();
  });

  function avg(list) { return list.length ? list.reduce(function (a, b) { return a + b; }, 0) / list.length : null; }
  function ansOf(f, key) { return (f.answers || {})[key]; }
  function median(list) {
    if (!list.length) return null;
    var a = list.slice().sort(function (x, y) { return x - y; }), m = Math.floor(a.length / 2);
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  }
  /* 「滿意」＝ 評分題前兩個選項（例如 非常滿意、滿意）；選項少於 4 個時只算第一個 */
  function topN(options) { return options.length >= 4 ? 2 : 1; }
  function isSat(options, v) { var i = options.indexOf(v); return i >= 0 && i < topN(options); }
  /* 成果報告用的整體指標：整體滿意度、各構面平均、整體平均、拉桿題平均與中位數 */
  function fbKpi(fs, sv) {
    var tot = 0, sat = 0, allSc = [], groups = [], sliders = [];
    sv.items.forEach(function (it) {
      if (it.type === "matrix") {
        var g = [];
        it.rows.forEach(function (rw) {
          fs.forEach(function (f) {
            var v = ansOf(f, rw.id), sc = U.scoreOf(it.options, v);
            if (!sc) return;
            tot++; if (isSat(it.options, v)) sat++;
            var s5 = sc / it.options.length * 5; g.push(s5); allSc.push(s5);
          });
        });
        groups.push({ title: it.title.replace(/[：:]$/, ""), avg: avg(g), n: it.rows.length });
      } else if (it.type === "slider") {
        var vals = fs.map(function (f) { var v = ansOf(f, it.id); return v === "" || v == null ? null : +v; }).filter(function (v) { return v != null && !isNaN(v); });
        sliders.push({ title: it.title.replace(/[：:]$/, ""), min: it.min, max: it.max, avg: avg(vals), median: median(vals), n: vals.length });
      }
    });
    return { satPct: tot ? sat / tot : null, overall: avg(allSc), groups: groups, sliders: sliders,
      items: groups.reduce(function (a, g) { return a + g.n; }, 0) };
  }
  function pct(c, n) { return n ? Math.round(c / n * 1000) / 10 + "%" : "0%"; }
  function round2(x) { return x == null ? "" : Math.round(x * 100) / 100; }

  /* 回饋分析表：每題每個選項的人數、比例、平均分數，匯出 Excel 用 */
  function fbAnalysisRows(id) {
    var fs = fbFor(id), act = actById(id), sv = act.survey, n = 0;
    var rows = [["問卷", sv.title], ["對象", act.audience], ["狀態", stText(act)], ["有效問卷", fs.length], ["匯出時間", U.ftime(new Date().toISOString())]];
    var K = fbKpi(fs, sv);
    if (K.groups.length) {
      rows.push(["整體滿意度（非常滿意＋滿意）", K.satPct == null ? "" : Math.round(K.satPct * 1000) / 10 + "%"]);
      K.groups.forEach(function (g) { rows.push([g.title + " 平均（滿分 5）", round2(g.avg)]); });
      rows.push(["整體平均（滿分 5，" + K.items + " 項細項）", round2(K.overall)]);
    }
    K.sliders.forEach(function (x) { rows.push([x.title + " 平均（滿分 " + x.max + "）", round2(x.avg)], [x.title + " 中位數", round2(x.median)]); });
    rows = rows.concat([[],
      ["題號", "題目", "項目／選項", "人數", "比例", "平均分數"]]);
    sv.items.forEach(function (it) {
      if (it.type === "note") return;
      n++;
      var title = it.title.replace(/[：:]$/, "");
      if (it.type === "single" || it.type === "multi") {
        var answered = fs.filter(function (f) { var v = ansOf(f, it.id); return Array.isArray(v) ? v.length : v; }).length;
        it.options.forEach(function (o) {
          var c = fs.filter(function (f) { var v = ansOf(f, it.id); return Array.isArray(v) ? v.indexOf(o) >= 0 : v === o; }).length;
          rows.push([n, title + (it.type === "multi" ? "（複選）" : ""), o, c, pct(c, answered), ""]);
        });
      } else if (it.type === "matrix") {
        it.rows.forEach(function (rw) {
          var sc = fs.map(function (f) { return U.scoreOf(it.options, ansOf(f, rw.id)); }).filter(Boolean);
          var st = fs.filter(function (f) { return isSat(it.options, ansOf(f, rw.id)); }).length;
          rows.push([n, title + "－" + rw.label, "平均（滿分 " + it.options.length + "）／滿意比例", sc.length, pct(st, sc.length), round2(avg(sc))]);
          it.options.forEach(function (o) {
            var c = fs.filter(function (f) { return ansOf(f, rw.id) === o; }).length;
            rows.push([n, title + "－" + rw.label, o, c, pct(c, fs.length), ""]);
          });
        });
      } else if (it.type === "slider") {
        var vals = fs.map(function (f) { var v = ansOf(f, it.id); return v === "" || v == null ? null : +v; }).filter(function (v) { return v != null && !isNaN(v); });
        rows.push([n, title, "平均（" + it.min + "～" + it.max + "）", vals.length, "", round2(avg(vals))]);
        rows.push([n, title, "中位數", "", "", round2(median(vals))]);
        if (vals.length) { rows.push([n, title, "最低", "", "", Math.min.apply(null, vals)]); rows.push([n, title, "最高", "", "", Math.max.apply(null, vals)]); }
      } else if (it.type === "text") {
        fs.forEach(function (f) { var v = String(ansOf(f, it.id) || "").trim(); if (v) rows.push([n, title, v, "", "", ""]); });
      }
    });
    return rows;
  }

  /* Excel 匯出：需要時才載入 SheetJS */
  var xlsxReady;
  function withXLSX() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (!xlsxReady) xlsxReady = new Promise(function (ok, no) {
      var sc = document.createElement("script");
      sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      sc.onload = function () { ok(window.XLSX); };
      sc.onerror = function () { xlsxReady = null; no(new Error("Excel 元件載入失敗，請檢查網路後再試，或改用 CSV。")); };
      document.head.appendChild(sc);
    });
    return xlsxReady;
  }
  function sheetName(t, used) {
    var b = String(t || "活動").replace(/[\\\/\?\*\[\]:]/g, "").slice(0, 28) || "活動", n = b, i = 2;
    while (used[n]) n = b.slice(0, 25) + "(" + i++ + ")";
    used[n] = 1; return n;
  }
  function saveXLSX(sheets, name) {
    return withXLSX().then(function (X) {
      var wb = X.utils.book_new(), used = {};
      sheets.forEach(function (sh) {
        var ws = X.utils.aoa_to_sheet(sh.rows);
        ws["!cols"] = (sh.cols || []).map(function (w) { return { wch: w }; });
        X.utils.book_append_sheet(wb, ws, sheetName(sh.name, used));
      });
      var data = X.write(wb, { bookType: "xlsx", type: "array" });
      saveBlob(new Blob([data], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), name + ".xlsx");
    }).catch(function (e) { U.toast(e.message); });
  }

  /* ---------- 圖表（SVG 橫條圖，可下載成 PNG） ---------- */
  S.charts = {};
  var PAL_SCREEN = { bar: "var(--accent)", ink: "var(--ink)", muted: "var(--muted)", line: "var(--line)", bg: "none" };
  var PAL_PNG = { bar: "#0f6b5c", ink: "#14302b", muted: "#566b65", line: "#d3dcd6", bg: "#ffffff" };
  function textW(t, size) { var w = 0; String(t).split("").forEach(function (c) { w += /[\u0000-ÿ]/.test(c) ? size * 0.58 : size; }); return w; }

        (f.deadline ? " · 截止 " + esc(U.dparts(f.deadline).full) : "") + "</span></span></div>" +
        '<div class="row"><button class="btn sm" type="button" data-view="' + esc(f.id) + '">看結果</button><button class="btn ghost sm" type="button" data-edit="' + esc(f.id) + '">編輯</button>' +
        '<button class="btn ghost sm" type="button" data-copylink="' + esc(f.id) + '">複製連結</button><button class="btn ghost sm" type="button" data-qr="' + esc(f.id) + '">QR Code</button>' +
        '<button class="btn ghost sm" type="button" data-dup="' + esc(f.id) + '">複製一份</button><button class="btn danger sm" type="button" data-del="' + esc(f.id) + '">刪除</button></div></div>';
    }).join("") : '<div class="panel"><p class="note">' + (S.forms.length ? "這個分類還沒有問卷。" : "還沒有問卷。按「新增問卷」建立第一份，可以從範本開始（例如課程滿意度、展覽參觀回饋）。") + "</p></div>";
    el.innerHTML = h + "</div>";
  }

  function fbRowsOf(id) {
    var fields = U.surveyFields(actById(id).survey);
    var rows = [["填寫時間"].concat(fields.map(function (f) { return f.group ? f.group + "－" + f.head : f.head; }))];
    fbFor(id).forEach(function (f) {
      rows.push([U.ftime(f.createdAt)].concat(fields.map(function (x) { var v = ansOf(f, x.key); return Array.isArray(v) ? v.join("、") : v; })));
    });
    return rows;
  }
  function download(rows, name) {
    var csv = "\uFEFF" + rows.map(function (r) { return r.map(csvCell).join(","); }).join("\r\n");
    saveBlob(new Blob([csv], { type: "text/csv;charset=utf-8" }), name + ".csv");
  }
  function saveBlob(blob, filename) {
    var url = URL.createObjectURL(blob), link = document.createElement("a");
    link.href = url; link.download = filename.replace(/[\\/:*?"<>|]/g, "");
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }
  function csvCell(v) {
    v = String(v == null ? "" : v);
    if (/^[=+\-@]/.test(v)) v = "'" + v; // 避免試算表把內容當成公式執行
    return '"' + v.replace(/"/g, '""') + '"';
  }


  document.addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target;
    if (f.id === "login-form") {
      if (S.busy) return; S.busy = true;
      U.api("login", { password: $("pw").value }).then(function (j) {
        S.token = j.token;
        try { sessionStorage.setItem("must-admin", S.token); } catch (x) {}
        render(); return load();
      }).catch(function (x) { U.toast(x.message); }).then(function () { S.busy = false; });
    }
  });
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-close],[data-aud],[data-back],[data-logout],[data-new],[data-edit],[data-dup],[data-view],[data-del],[data-copylink],[data-qr],[data-qrpng],[data-rmresp],[data-fbcsv],[data-fbxlsx],[data-fbprint],[data-chartpng],[data-allcharts],[data-qadd],[data-qmove],[data-qdel],[data-svsave],[data-svapply],[data-svtpl],[data-svdeltpl]");
    if (!t) { if (e.target === $("dlg")) U.closeDlg(); return; }
    var d = t.dataset, f;
    if (d.close !== undefined) U.closeDlg();
    else if (d.aud !== undefined) { S.aud = d.aud; render(); }
    else if (d.back !== undefined) go("");
    else if (d.logout !== undefined) logout("已登出。");
    else if (d.new !== undefined) openEdit("");
    else if (d.edit !== undefined) openEdit(d.edit);
    else if (d.dup !== undefined) openEdit(d.dup, true);
    else if (d.view !== undefined) go(d.view);
    else if (d.del !== undefined) {
      f = actById(d.del); var nr = fbFor(d.del).length;
      if (d.sure !== "1") { d.sure = "1"; t.textContent = nr ? "連同 " + nr + " 份回覆一起刪除？" : "確定刪除？"; return; }
      svCall(call("deleteForm", { id: d.del }), "問卷「" + (f ? f.title : "") + "」已刪除。", false);
    } else if (d.copylink !== undefined) {
      var link = formLink(d.copylink);
      navigator.clipboard.writeText(link).then(function () { U.toast("問卷連結已複製，可直接貼到 LINE 或 FB。"); }, function () { U.toast("無法自動複製，連結是：" + link); });
    } else if (d.qr !== undefined) openQr(d.qr);
    else if (d.qrpng !== undefined) qrPng(d.qrpng);
    else if (d.rmresp !== undefined) {
      if (d.sure !== "1") { d.sure = "1"; t.textContent = "確定刪除？"; return; }
      svCall(call("deleteFormResponse", { id: d.rmresp }), "已刪除這份回覆。", false);
    } else if (d.fbcsv !== undefined) {
      download(fbRowsOf(S.pick), "問卷回覆-" + actById(S.pick).title);
    } else if (d.fbxlsx !== undefined) {
      var tt = actById(S.pick).title;
      saveXLSX([{ name: "分析", rows: fbAnalysisRows(S.pick), cols: [6, 36, 28, 8, 8, 10] }, { name: "原始回答", rows: fbRowsOf(S.pick), cols: [18] }], "問卷分析-" + tt);
    } else if (d.fbprint !== undefined) window.print();
    else if (d.chartpng !== undefined) chartPNG(d.chartpng);
    else if (d.allcharts !== undefined) allChartsPNG(d.allcharts);
    else if (d.qadd !== undefined) {
      edSyncAll(); S.ed.sv.items.push(newItem(d.qadd)); renderSurvey(S.ed.sv.items.length - 1);
    } else if (d.qmove !== undefined) {
      edSyncAll(); var qi = +t.closest("[data-i]").dataset.i, to = qi + +d.qmove, its = S.ed.sv.items;
      if (to >= 0 && to < its.length) { var tmp = its[qi]; its[qi] = its[to]; its[to] = tmp; renderSurvey(to); }
    } else if (d.qdel !== undefined) {
      if (d.sure !== "1") { d.sure = "1"; t.textContent = "確定刪除？"; return; }
      edSyncAll(); S.ed.sv.items.splice(+t.closest("[data-i]").dataset.i, 1); renderSurvey();
    } else if (d.svapply !== undefined) {
      var pick = $("sv-tpl").value;
      if (!pick) { U.toast("請先選擇一個範本。"); return; }
      var src = pick === "__default" ? U.DEFAULT_SURVEY : (S.surveyTpls.filter(function (x) { return x.id === pick; })[0] || {}).survey;
      if (src) { edSyncAll(); S.ed.sv = JSON.parse(JSON.stringify(src)); renderSurvey(); U.toast("已套用範本，記得按「儲存問卷」。"); }
    } else if (d.svdeltpl !== undefined) {
      var did = $("sv-tpl").value;
      if (!did || did === "__default") { U.toast("請先選擇要刪除的範本。"); return; }
      if (d.sure !== "1") { d.sure = "1"; t.textContent = "確定刪除範本？"; return; }
      edSyncAll(); svCall(call("deleteSurveyTpl", { id: did }), "範本已刪除。", true);
    } else if (d.svtpl !== undefined) {
      edSyncAll(); var nm = $("sv-tplname").value.trim();
      if (!nm) { U.toast("請先輸入範本名稱。"); $("sv-tplname").focus(); return; }
      if (S.surveyTpls.some(function (x) { return x.name === nm; }) && d.sure !== "1") { d.sure = "1"; t.textContent = "已有同名範本，再按一次覆蓋"; return; }
      svCall(call("saveSurveyTpl", { name: nm, survey: S.ed.sv }), "已存成範本「" + nm + "」。", true);
    } else if (d.svsave !== undefined) {
      edSyncAll();
      if (!S.ed.sv.title) { U.toast("請填寫問卷標題。"); $("sv-title").focus(); return; }
      var fm = S.ed.form, isNew = !fm.id;
      svCall(call("saveForm", { form: { id: fm.id, audience: fm.audience, status: fm.status, deadline: fm.deadline, survey: S.ed.sv } }),
        isNew ? "問卷已建立，可以複製連結或下載 QR Code 了。" : "問卷已儲存。", false, function (j) { go(j.id); if (isNew) openQr(j.id); });
    }
  });

  if (location.hash.length > 1) S.pick = decodeURIComponent(location.hash.slice(1));
  render();
  if (U.configured()) loadLoginCfg();
  if (S.token) load();
})();
</script>
</body>
</html>
