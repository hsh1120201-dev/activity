<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>管理後台｜新竹社會創新基地活動報名平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">HSINCHU SOCIAL INNOVATION HUB</div>
  </header>
  <main>
    <div class="hero">
      <h1>管理<em>後台</em></h1>
      <p>新增活動、查看報名名單與回饋。</p>
    </div>
    <section id="body"></section>
  </main>
</div>

<dialog id="dlg" aria-labelledby="dlg-title"><div class="dlg" id="dlg-body"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="common.js"></script>
<script>
(function () {
  "use strict";
  var $ = U.$, esc = U.esc;
  var S = { token: "", acts: [], regs: [], fbs: [], mails: [], templates: [], quota: null, sender: "", off: {}, counts: {}, loaded: false, tab: "acts", pick: "", busy: false };
  try { S.token = sessionStorage.getItem("must-admin") || ""; } catch (e) {}

  function actById(id) { for (var i = 0; i < S.acts.length; i++) if (S.acts[i].id === id) return S.acts[i]; return null; }
  function regsFor(id) { return S.regs.filter(function (r) { return r.activityId === id; }).sort(function (a, b) { return (a.createdAt || "") < (b.createdAt || "") ? -1 : 1; }); }
  function fbFor(id) { return S.fbs.filter(function (f) { return f.activityId === id; }); }
  function picked(id) { return regsFor(id).filter(function (r) { return !S.off[r.id]; }); }
  function mailCell(id, r) {
    var ms = S.mails.filter(function (m) { return m.activityId === id && m.to === r.contact && m.name === r.name; });
    if (!ms.length) return '<span class="cnt">—</span>';
    return ms.slice(-3).map(function (m) {
      var ok = m.status === "已寄出";
      return '<span class="cnt" title="' + esc(m.subject) + '">' + (ok ? "✓ " : "✗ ") + esc(m.kind) + " " + esc(U.ftime(m.sentAt).slice(5)) + (ok ? "" : "（失敗）") + "</span>";
    }).join("<br>");
  }
  var TAGS = ["姓名", "課程", "日期", "月日", "時間", "地點", "問卷連結", "活動圖片"];
  var WD = ["日", "一", "二", "三", "四", "五", "六"];
  function cDate(d, short) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || "");
    if (!m) return d || "";
    var md = +m[2] + "月" + +m[3] + "日（" + WD[new Date(+m[1], +m[2] - 1, +m[3]).getDay()] + "）";
    return short ? md : m[1] + "年" + md;
  }
  function fillMail(text, a, r) {
    var map = { "姓名": r.name, "課程": a.title, "日期": cDate(a.date), "月日": cDate(a.date, true), "時間": a.time, "地點": a.location, "問卷連結": fbLink(a.id),
      "活動圖片": a.image ? "![" + String(a.title || "活動圖片").replace(/[\[\]]/g, "") + "](" + a.image + ")" : "" };
    return String(text || "").replace(/\{(姓名|課程|日期|月日|時間|地點|問卷連結|活動圖片)\}/g, function (_, k) { return map[k] || ""; });
  }
  function tplOptions() {
    return '<option value="">（選擇範本，會取代下面的主旨和內容）</option>' + S.templates.map(function (t) { return '<option value="' + esc(t.id) + '">' + esc(t.name) + "</option>"; }).join("");
  }
  function openMail() {
    var a = actById(S.pick), to = picked(S.pick);
    if (!a || !to.length) return;
    var draft = S.draft && S.draft.act === a.id ? S.draft : { subject: "【{課程}】活動通知", body: "{姓名} 您好：\n\n\n\n新竹社會創新基地\n電話｜03-5593142 分機 3529" };
    U.showDlg(U.head("寄信給報名者") + '<form id="mail-form" class="survey">' +
      '<div class="f"><span>收件人（' + to.length + " 位）</span><div class=\"fixed\">" + to.map(function (r) { return esc(r.name); }).join("、") + "</div></div>" +
      '<div class="f"><span>信件範本</span><div class="row"><select id="m-tpl" style="flex:1 1 220px">' + tplOptions() + '</select>' +
      '<button class="btn danger sm" type="button" data-deltpl hidden>刪除這個範本</button></div></div>' +
      U.fld("m-subject", "主旨", draft.subject, true, "text", ' maxlength="200"') +
      '<label class="f" for="m-body"><span>內容 <i>*</i></span><textarea id="m-body" rows="14" maxlength="10000">' + esc(draft.body) + "</textarea></label>" +
      '<p class="note" style="margin:-6px 0 0">格式：<code>**粗體**</code>　<code>[顯示文字](網址)</code> 變成連結　<code>![說明](圖片網址)</code> 是圖片　網址會自動變連結　單獨一行 <code>-</code> 是分隔線　可以直接貼上表情符號 😊</p>' +
      '<div class="f"><span>插入代換文字（每個人會換成自己的資料）</span><div class="choices">' +
      TAGS.map(function (t) { return '<button class="btn ghost sm" type="button" data-tag="' + t + '">{' + t + "}</button>"; }).join("") + "</div>" +
      (actById(S.pick) && actById(S.pick).image ? "" : '<p class="note" style="margin:0">這堂課還沒有上傳海報，{活動圖片} 不會顯示任何東西。</p>') + "</div>" +
      '<div class="f"><span>插入圖片（放在游標的位置）</span><div class="row"><label class="btn ghost sm" for="m-file">從電腦選圖片</label>' +
      '<input type="file" id="m-file" accept="image/jpeg,image/png,image/webp" hidden><span id="m-imgmsg" class="cnt"></span></div></div>' +
      '<div class="f"><span>預覽（以「' + esc(to[0].name) + '」為例）</span><div class="mailprev"><b id="m-pv-s"></b><div id="m-pv-b" class="mailbody"></div></div></div>' +
      '<p class="note">寄件人：' + esc(S.sender || "新竹社會創新基地") + "（從部署 Apps Script 的 Gmail 帳號寄出）" + (S.quota != null ? "。今天還能寄 " + S.quota + " 封。" : "") + "</p>" +
      '<div class="row"><input type="text" id="m-tplname" maxlength="40" placeholder="範本名稱，例如：課前提醒" aria-label="範本名稱" style="flex:1 1 200px"><button class="btn ghost sm" type="button" data-savetpl>把目前內容存成範本</button></div>' +
      '<div class="row"><button class="btn" type="submit" id="m-send">寄出 ' + to.length + ' 封信</button><button class="btn ghost" type="button" data-close>取消</button></div></form>');
    mailPreview();
  }
  function mailPreview() {
    var a = actById(S.pick), r = picked(S.pick)[0];
    if (!a || !r || !$("m-pv-s")) return;
    $("m-pv-s").textContent = fillMail($("m-subject").value, a, r);
    $("m-pv-b").innerHTML = U.mailHtml(fillMail($("m-body").value, a, r));
    S.draft = { act: a.id, subject: $("m-subject").value, body: $("m-body").value };
  }
  function sendMail(f) {
    var to = picked(S.pick), btn = $("m-send");
    var subject = $("m-subject").value.trim(), body = $("m-body").value;
    if (!subject || !body.trim()) { U.toast("請填寫主旨和內容。"); return; }
    if (btn.dataset.sure !== "1") { btn.dataset.sure = "1"; btn.textContent = "確定寄給 " + to.length + " 人？再按一次"; return; }
    if (S.busy) return;
    S.busy = true; btn.disabled = true; btn.textContent = "寄送中，請不要關閉視窗…";
    call("sendMail", { activityId: S.pick, ids: to.map(function (r) { return r.id; }), subject: subject, body: body, surveyUrl: fbLink(S.pick) })
      .then(function (j) {
        S.draft = null; U.closeDlg();
        U.toast("已寄出 " + j.sent + " 封" + (j.failed && j.failed.length ? "，失敗 " + j.failed.length + " 封：" + j.failed.join("、") : "。"));
        return load();
      }, function (e) {
        if (e.code !== "auth") U.toast(e.message);
        btn.disabled = false; btn.dataset.sure = ""; btn.textContent = "寄出 " + to.length + " 封信";
      }).then(function () { S.busy = false; });
  }
  /* ---------- 回饋問卷編輯器 ---------- */
  var QT = { single: "單選題", multi: "複選題", matrix: "評分表（多個項目用同一組選項評分）", text: "文字填答", slider: "拉桿（數字範圍）", note: "說明文字（不是題目）" };
  var SCALE5 = ["非常滿意", "滿意", "普通", "不滿意", "非常不滿意"];
  function rid(p) { return p + Math.random().toString(36).slice(2, 8); }
  function newItem(type) {
    var it = { id: rid(type === "note" ? "n" : "q"), type: type, title: "", required: type !== "text" && type !== "note" };
    if (type === "single" || type === "multi") it.options = ["選項 1", "選項 2"];
    if (type === "multi") { it.minSel = 1; it.maxSel = 2; }
    if (type === "matrix") { it.options = SCALE5.slice(); it.rows = [{ id: rid("r"), label: "項目 1" }]; }
    if (type === "slider") { it.min = 0; it.max = 100; }
    if (type === "note") it.text = "";
    return it;
  }
  function lines(v) { return String(v || "").split("\n").map(function (x) { return x.trim(); }).filter(Boolean); }
  function openSurvey(id) {
    var a = actById(id); if (!a) return;
    S.ed = { act: id, sv: JSON.parse(JSON.stringify(U.surveyOf(a))) };
    renderSurvey();
  }
  /* 把畫面上的輸入值寫回 S.ed.sv（只在需要時呼叫，避免打字時重畫） */
  function edSync() {
    var form = $("sv-form"); if (!form || !S.ed) return;
    var sv = S.ed.sv;
    sv.title = $("sv-title").value.trim(); sv.intro = $("sv-intro").value;
    form.querySelectorAll("[data-i]").forEach(function (card) {
      var it = sv.items[+card.dataset.i]; if (!it) return;
      var get = function (k) { var el = card.querySelector('[data-qf="' + k + '"]'); return el ? (el.type === "checkbox" ? el.checked : el.value) : undefined; };
      if (it.type === "note") { it.text = get("text"); return; }
      it.title = get("title").trim(); it.required = get("required");
      if (it.type === "single" || it.type === "multi" || it.type === "matrix") it.options = lines(get("options"));
      if (it.type === "multi") { it.minSel = parseInt(get("minSel"), 10) || 1; it.maxSel = parseInt(get("maxSel"), 10) || it.options.length; }
      if (it.type === "matrix") it.rows = lines(get("rows")).map(function (label, k) { return { id: (it.rows[k] && it.rows[k].id) || rid("r"), label: label }; });
      if (it.type === "slider") { it.min = parseInt(get("min"), 10) || 0; it.max = parseInt(get("max"), 10); }
    });
  }
  function renderSurvey(focusIdx) {
    var a = actById(S.ed.act), sv = S.ed.sv, nfb = fbFor(S.ed.act).length, n = 0;
    var tf = function (k, label, val, extra) { return '<label class="f"><span>' + label + '</span><input type="text" data-qf="' + k + '" value="' + esc(val == null ? "" : val) + '"' + (extra || "") + "></label>"; };
    var ta = function (k, label, val, rows) { return '<label class="f"><span>' + label + '</span><textarea data-qf="' + k + '" rows="' + (rows || 4) + '">' + esc(val) + "</textarea></label>"; };
    var num = function (k, label, val) { return '<label class="f"><span>' + label + '</span><input type="number" data-qf="' + k + '" value="' + esc(val) + '"></label>'; };
    var h = U.head("回饋問卷：" + (a.title || "")) + '<form id="sv-form" class="survey" novalidate>' +
      (nfb ? '<div class="warn">這個活動已經收到 ' + nfb + " 份回饋。修改後舊的回答都會保留，但刪除或改過的題目，舊回答可能對不上。</div>" : "") +
      '<div class="f"><span>套用問卷範本（會取代下面全部題目）</span><div class="row"><select id="sv-tpl" style="flex:1 1 200px"><option value="">選擇範本…</option><option value="__default">預設：課程滿意度調查</option>' +
      S.surveyTpls.map(function (x) { return '<option value="' + esc(x.id) + '">' + esc(x.name) + "</option>"; }).join("") +
      '</select><button class="btn ghost sm" type="button" data-svapply>套用</button><button class="btn danger sm" type="button" data-svdeltpl>刪除範本</button></div></div>' +
      '<label class="f" for="sv-title"><span>問卷標題</span><input type="text" id="sv-title" maxlength="100" value="' + esc(sv.title) + '"></label>' +
      '<label class="f" for="sv-intro"><span>問卷說明（顯示在題目上方）</span><textarea id="sv-intro" rows="3" maxlength="2000">' + esc(sv.intro || "") + "</textarea></label>";
    sv.items.forEach(function (it, i) {
      var label = it.type === "note" ? "說明文字" : "第 " + (++n) + " 題";
      h += '<div class="qcard" data-i="' + i + '"><div class="qhead"><b>' + label + "</b><span class=\"cnt\">" + QT[it.type] + "</span>" +
        '<span class="qtools"><button class="btn ghost sm" type="button" data-qmove="-1" aria-label="上移"' + (i ? "" : " disabled") + ">↑</button>" +
        '<button class="btn ghost sm" type="button" data-qmove="1" aria-label="下移"' + (i < sv.items.length - 1 ? "" : " disabled") + ">↓</button>" +
        '<button class="btn danger sm" type="button" data-qdel>刪除</button></span></div>';
      if (it.type === "note") h += ta("text", "說明內容", it.text, 3);
      else {
        h += tf("title", "題目", it.title, ' maxlength="200"') +
          '<label class="chk"><input type="checkbox" data-qf="required"' + (it.required ? " checked" : "") + "> 必填</label>";
        if (it.type === "single" || it.type === "multi") h += ta("options", "選項（一行一個）", (it.options || []).join("\n"), Math.min(10, (it.options || []).length + 1));
        if (it.type === "multi") h += '<div class="grid2">' + num("minSel", "最少選幾項", it.minSel) + num("maxSel", "最多選幾項", it.maxSel) + "</div>";
        if (it.type === "matrix") h += ta("rows", "評分項目（一行一個）", (it.rows || []).map(function (r) { return r.label; }).join("\n"), Math.min(8, (it.rows || []).length + 1)) +
          ta("options", "評分選項（一行一個，第一個分數最高）", (it.options || []).join("\n"), Math.min(8, (it.options || []).length + 1));
        if (it.type === "slider") h += '<div class="grid2">' + num("min", "最小值", it.min) + num("max", "最大值", it.max) + "</div>";
      }
      h += "</div>";
    });
    h += '<div class="f"><span>新增題目</span><div class="row">' + Object.keys(QT).map(function (k) { return '<button class="btn ghost sm" type="button" data-qadd="' + k + '">＋ ' + QT[k].replace(/（.*）/, "") + "</button>"; }).join("") + "</div></div>" +
      '<div class="row"><input type="text" id="sv-tplname" maxlength="40" placeholder="範本名稱，例如：工作坊回饋" aria-label="範本名稱" style="flex:1 1 200px"><button class="btn ghost sm" type="button" data-svtpl>另存為問卷範本</button></div>' +
      '<div class="row"><button class="btn" type="button" data-svsave>儲存到這個活動</button><button class="btn ghost" type="button" data-close>取消</button>' +
      (a.customSurvey ? '<button class="btn danger sm" type="button" data-svreset style="margin-left:auto">恢復預設問卷</button>' : "") + "</div></form>";
    U.showDlg(h);
    if (focusIdx != null) { var c = document.querySelector('[data-i="' + focusIdx + '"]'); if (c) { c.scrollIntoView({ block: "center" }); var inp = c.querySelector("input,textarea"); if (inp) inp.focus(); } }
  }
  function svCall(p, okMsg, reopen) {
    if (S.busy) return;
    S.busy = true;
    var keep = S.ed;
    p.then(function () {
      U.toast(okMsg);
      return load().then(function () { if (reopen && keep) { S.ed = keep; renderSurvey(); } else U.closeDlg(); });
    }).catch(function (e) { if (e.code !== "auth") U.toast(e.message); })
      .then(function () { S.busy = false; });
  }
  document.addEventListener("change", function (e) {
    if (!S.ed || !e.target.closest || !e.target.closest("#sv-form")) return;
    if (e.target.dataset.qf === "required") edSync();
  });

  function fbLink(id) { return new URL("./", location.href).href + "#fb-" + id; }
  /* 每個活動的專屬網頁，可貼到 FB／LINE */
  function actLink(id) { return new URL("./", location.href).href + "?id=" + encodeURIComponent(id); }
  function avg(list) { return list.length ? list.reduce(function (a, b) { return a + b; }, 0) / list.length : null; }
  function bar(p) { return '<span class="bar"><i style="width:' + Math.round(p * 100) + '%"></i></span>'; }

  function ansOf(f, key) { return (f.answers || {})[key]; }
  function median(list) {
    if (!list.length) return null;
    var a = list.slice().sort(function (x, y) { return x - y; }), m = Math.floor(a.length / 2);
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  }
  /* 「滿意」＝ 評分題前兩個選項（例如 非常滿意、滿意）；選項少於 4 個時只算第一個 */
  function topN(options) { return options.length >= 4 ? 2 : 1; }
  function isSat(options, v) { var i = options.indexOf(v); return i >= 0 && i < topN(options); }
  /* 成果報告用的整體指標：整體滿意度、各構面平均、整體平均、拉桿題平均與中位數 */
  function fbKpi(fs, sv) {
    var tot = 0, sat = 0, allSc = [], groups = [], sliders = [];
    sv.items.forEach(function (it) {
      if (it.type === "matrix") {
        var g = [];
        it.rows.forEach(function (rw) {
          fs.forEach(function (f) {
            var v = ansOf(f, rw.id), sc = U.scoreOf(it.options, v);
            if (!sc) return;
            tot++; if (isSat(it.options, v)) sat++;
            var s5 = sc / it.options.length * 5; g.push(s5); allSc.push(s5);
          });
        });
        groups.push({ title: it.title.replace(/[：:]$/, ""), avg: avg(g), n: it.rows.length });
      } else if (it.type === "slider") {
        var vals = fs.map(function (f) { var v = ansOf(f, it.id); return v === "" || v == null ? null : +v; }).filter(function (v) { return v != null && !isNaN(v); });
        sliders.push({ title: it.title.replace(/[：:]$/, ""), min: it.min, max: it.max, avg: avg(vals), median: median(vals), n: vals.length });
      }
    });
    return { satPct: tot ? sat / tot : null, overall: avg(allSc), groups: groups, sliders: sliders,
      items: groups.reduce(function (a, g) { return a + g.n; }, 0) };
  }
  function pct(c, n) { return n ? Math.round(c / n * 1000) / 10 + "%" : "0%"; }
  function round2(x) { return x == null ? "" : Math.round(x * 100) / 100; }

  /* 回饋分析表：每題每個選項的人數、比例、平均分數，匯出 Excel 用 */
  function fbAnalysisRows(id) {
    var fs = fbFor(id), act = actById(id), sv = U.surveyOf(act), n = 0;
    var rows = [["活動", (act && act.title) || ""], ["日期", act ? U.dparts(act.date).full : ""], ["問卷", sv.title],
      ["有效問卷", fs.length], ["報名人數", regsFor(id).length], ["填答率", regsFor(id).length ? pct(fs.length, regsFor(id).length) : "—"]];
    var K = fbKpi(fs, sv);
    if (K.groups.length) {
      rows.push(["整體滿意度（非常滿意＋滿意）", K.satPct == null ? "" : Math.round(K.satPct * 1000) / 10 + "%"]);
      K.groups.forEach(function (g) { rows.push([g.title + " 平均（滿分 5）", round2(g.avg)]); });
      rows.push(["整體平均（滿分 5，" + K.items + " 項細項）", round2(K.overall)]);
    }
    K.sliders.forEach(function (x) { rows.push([x.title + " 平均（滿分 " + x.max + "）", round2(x.avg)], [x.title + " 中位數", round2(x.median)]); });
    rows = rows.concat([[],
      ["題號", "題目", "項目／選項", "人數", "比例", "平均分數"]]);
    sv.items.forEach(function (it) {
      if (it.type === "note") return;
      n++;
      var title = it.title.replace(/[：:]$/, "");
      if (it.type === "single" || it.type === "multi") {
        var answered = fs.filter(function (f) { var v = ansOf(f, it.id); return Array.isArray(v) ? v.length : v; }).length;
        it.options.forEach(function (o) {
          var c = fs.filter(function (f) { var v = ansOf(f, it.id); return Array.isArray(v) ? v.indexOf(o) >= 0 : v === o; }).length;
          rows.push([n, title + (it.type === "multi" ? "（複選）" : ""), o, c, pct(c, answered), ""]);
        });
      } else if (it.type === "matrix") {
        it.rows.forEach(function (rw) {
          var sc = fs.map(function (f) { return U.scoreOf(it.options, ansOf(f, rw.id)); }).filter(Boolean);
          var st = fs.filter(function (f) { return isSat(it.options, ansOf(f, rw.id)); }).length;

        var c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
        var g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        ok(c.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = function () { URL.revokeObjectURL(url); bad(new Error("這個檔案無法當成圖片讀取，請換一張 JPG 或 PNG。")); };
      img.src = url;
    });
  }
  function insertAtCursor(ta, text) {
    var st = ta.selectionStart == null ? ta.value.length : ta.selectionStart, en = ta.selectionEnd == null ? st : ta.selectionEnd;
    ta.value = ta.value.slice(0, st) + text + ta.value.slice(en);
    ta.focus(); ta.selectionStart = ta.selectionEnd = st + text.length;
  }
  function mailImage(file, input) {
    var msg = $("m-imgmsg"), ta = $("m-body"), pos = ta.selectionStart;
    if (!/^image\//.test(file.type)) { U.toast("請選擇圖片檔（JPG、PNG）。"); input.value = ""; return; }
    if (S.uploading) return;
    S.uploading = true; msg.textContent = "圖片上傳中…"; $("m-send").disabled = true;
    shrink(file).then(function (dataUrl) {
      return call("uploadImage", { type: "image/jpeg", name: "信件圖片", data: dataUrl.split(",")[1] });
    }).then(function (j) {
      if (pos != null) { ta.selectionStart = ta.selectionEnd = pos; }
      insertAtCursor(ta, "\n![圖片](" + j.url + ")\n");
      msg.textContent = "已插入"; mailPreview();
    }).catch(function (e) { msg.textContent = ""; if (e.code !== "auth") U.toast(e.message); })
      .then(function () { S.uploading = false; input.value = ""; var b = $("m-send"); if (b) b.disabled = false; });
  }
  function uploadImage(file, input) {
    var msg = $("e-imgmsg");
    if (!/^image\//.test(file.type)) { U.toast("請選擇圖片檔（JPG、PNG）。"); input.value = ""; return; }
    S.uploading = true; msg.textContent = "上傳中…";
    shrink(file).then(function (dataUrl) {
      $("e-preview").innerHTML = '<img src="' + dataUrl + '" alt="新選的活動圖片">';
      var title = ($("e-title") && $("e-title").value.trim()) || "活動圖片";
      return call("uploadImage", { type: "image/jpeg", name: title, data: dataUrl.split(",")[1] });
    }).then(function (j) {
      $("e-image").value = j.url; msg.textContent = "已上傳，記得按「儲存活動」";
      var rm = document.querySelector("[data-noimg]"); if (rm) rm.hidden = false;
    }).catch(function (e) {
      msg.textContent = ""; U.toast(e.message);
      var cur = $("e-image").value;
      $("e-preview").innerHTML = cur ? '<img src="' + esc(cur) + '" alt="目前的活動圖片">' : '<span class="note">尚未上傳圖片</span>';
    }).then(function () { S.uploading = false; input.value = ""; });
  }

  render();
  if (S.token && U.configured()) load().catch(function (e) { if (e.code !== "auth") { $("body").innerHTML = '<div class="panel"><p class="note">' + esc(e.message) + "</p></div>"; } });
})();
</script>
</body>
</html>
