<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新竹社會創新基地活動報名平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="logo-mark.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css?v=20261124b">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="./"><img class="logo-light" src="logo.svg" alt="新竹社會創新基地 Hsinchu Social Innovation Hub" width="139" height="44"><img class="logo-dark" src="logo-dark.svg" alt="" aria-hidden="true" width="139" height="44"></a>
  </header>

  <main>
    <div class="hero">
      <h1 class="hero-title"><span>新竹社會創新基地</span><span><em>活動報名</em>平台</span></h1>
      <p>講座、工作坊與交流活動，都在這裡報名與填寫回饋。</p>
    </div>

    <section aria-labelledby="h-list">
      <div class="sec-head"><h2 id="h-list">近期活動</h2><small>按「我要報名」或「填寫回饋」即可開始</small></div>
      <div class="filters">
        <label for="f-sem">類別<select id="f-sem"><option value="">全部類別</option></select></label>
        <label for="f-status">狀態<select id="f-status">
          <option value="">全部狀態</option><option value="open">報名中</option><option value="feedback">回饋中</option><option value="closed">已結束</option>
        </select></label>
      </div>
      <div id="list" class="list"><div class="panel"><p class="note">載入中…</p></div></div>
    </section>
    <!-- 單一活動頁：網址加上 ?id=活動編號 時顯示 -->
    <section id="single" class="single" hidden aria-live="polite"><div class="panel"><p class="note">載入中…</p></div></section>
  </main>
</div>

<dialog id="dlg" aria-labelledby="dlg-title"><div class="dlg" id="dlg-body"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="common.js"></script>
<script>
(function () {
  "use strict";
  var $ = U.$, esc = U.esc;
  var S = { acts: [], counts: {}, loaded: false, error: "", sid: "", busy: false, view: "", flash: "" };
  /* 每個活動都有自己的網頁：index.html?id=活動編號（可加 &v=reg 或 &v=fb 直接開報名表或問卷） */
  var QS = new URLSearchParams(location.search);
  S.single = (QS.get("id") || "").replace(/[^A-Za-z0-9]/g, "");
  if (S.single) {
    document.body.classList.add("is-single");
    document.querySelector(".hero").hidden = true;
    document.querySelector('section[aria-labelledby="h-list"]').hidden = true;
    $("single").hidden = false;
  }
  function pageHead(t) {
    return '<a class="back" href="./">← 所有活動</a><h2 id="dlg-title" class="single-title">' + esc(t) + "</h2>";
  }
  function show(h) {
    if (!S.single) { U.showDlg(h); return; }
    $("single").innerHTML = '<div class="panel dlg">' + (S.flash ? '<div class="ok">' + esc(S.flash) + "</div>" : "") + h + "</div>";
    S.flash = "";
  }
  function renderSingle() {
    if (!S.single) return;
    if (!U.configured()) { $("single").innerHTML = U.SETUP_NOTE; return; }
    if (S.error) { $("single").innerHTML = '<div class="panel"><p class="note">' + esc(S.error) + '</p><p style="margin:10px 0 0"><button class="btn ghost sm" type="button" data-reload>重新載入</button></p></div>'; return; }
    if (!S.loaded) return;
    if (!actById(S.single)) { $("single").innerHTML = '<div class="panel dlg">' + pageHead("找不到這個活動") + '<p class="note">這個活動可能已經刪除，或網址有誤。</p></div>'; document.title = "找不到活動｜新竹社會創新基地"; return; }
    openAct(S.single, S.view || QS.get("v") || "");
  }
  try { S.sid = localStorage.getItem("must-sid") || ""; } catch (e) {}

  function actById(id) { for (var i = 0; i < S.acts.length; i++) if (S.acts[i].id === id) return S.acts[i]; return null; }
  function isFull(a) { return a.capacity > 0 && (S.counts[a.id] || 0) >= a.capacity; }

  function actRow(a) {
    var d = U.dparts(a.date);
    var meta = [a.semester, a.time, a.location].filter(Boolean).map(esc).join(" · ");
    var chip = a.status === "open" && isFull(a) ? "額滿" : "";
    return '<div class="act act-card">' +
      '<span class="date"><b>' + esc(d.md) + "</b><i>" + esc(d.wd) + "</i></span>" +
      '<span class="body"><span class="t">' + esc(a.title || "未命名活動") + "</span>" +
      (meta ? '<span class="m">' + meta + "</span>" : "") +
      '<span class="tags"><span class="pill ' + esc(a.status) + '">' + esc(U.STATUS[a.status] || "") + "</span>" +
      actBtns(a) +
      (chip ? '<span class="chip">' + chip + "</span>" : "") +
      '<span class="cnt">' + esc(U.capText(a, S.counts)) + "</span></span></span>" +
      (a.image ? '<span class="thumb"><img src="' + esc(a.image) + '" alt="" loading="lazy" onerror="this.parentNode.remove()"></span>' : "") + "</div>";
  }

  /* 報名、回饋兩顆獨立按鈕：一直顯示，沒開放的那顆反灰不能按 */
  function actBtns(a, view) {
    var regOn = a.status === "open", fbOn = a.status === "feedback";
    function b(kind, on, label, offLabel) {
      return '<button class="btn sm' + (view && view !== kind ? " ghost" : "") + '" type="button" data-view="' + kind + '" data-id="' + esc(a.id) + '"' +
        (on ? "" : " disabled") + (view ? ' aria-pressed="' + (view === kind) + '"' : "") + ">" + (on ? label : offLabel) + "</button>";
    }
    var tag = view === undefined ? "span" : "div";
    return "<" + tag + ' class="act-btns' + (view === undefined ? " inline" : "") + '" role="group" aria-label="報名或填寫回饋">' +
      b("reg", regOn, "我要報名", a.status === "closed" || fbOn ? "報名已截止" : "尚未開放報名") +
      b("fb", fbOn, "填寫回饋", a.status === "closed" ? "回饋已關閉" : "回饋尚未開放") + "</" + tag + ">";
  }

  function render() {
    var sel = $("f-sem"), cur = sel.value, sems = {};
    S.acts.forEach(function (a) { if (a.semester) sems[a.semester] = 1; });
    var keys = Object.keys(sems).sort().reverse();
    sel.innerHTML = '<option value="">全部類別</option>' + keys.map(function (k) { return '<option value="' + esc(k) + '">' + esc(k) + "</option>"; }).join("");
    if (keys.indexOf(cur) >= 0) sel.value = cur;
    var fs = sel.value, ft = $("f-status").value, list = $("list");

    if (!U.configured()) list.innerHTML = U.SETUP_NOTE;
    else if (S.error) list.innerHTML = '<div class="panel"><p class="note">' + esc(S.error) + '</p><p style="margin:10px 0 0"><button class="btn ghost sm" type="button" data-reload>重新載入</button></p></div>';
    else if (!S.loaded) list.innerHTML = '<div class="panel"><p class="note">載入中…</p></div>';
    else {
      var rows = U.sortActs(S.acts).filter(function (a) { return (!fs || a.semester === fs) && (!ft || a.status === ft); });
      list.innerHTML = rows.length ? rows.map(actRow).join("") :
        '<div class="panel"><p class="note">' + (S.acts.length ? "沒有符合條件的活動，試試其他類別或狀態。" : "目前還沒有活動。") + "</p></div>";
    }
  }

  function load() {
    if (!U.configured()) { render(); renderSingle(); return Promise.resolve(); }
    return U.api("list").then(function (j) { S.acts = j.activities || []; S.counts = j.counts || {}; S.loaded = true; S.error = ""; render(); renderSingle(); },
      function (e) { if (!S.loaded) S.error = e.message; render(); renderSingle(); });
  }
  function remember(sid) { S.sid = sid; try { localStorage.setItem("must-sid", sid); } catch (e) {} }

  /* 報名與回饋是兩個獨立按鈕：view 為 "reg"（報名）或 "fb"（回饋），沒指定時依活動狀態決定先顯示哪一個；again 為 true 時，填過的裝置也直接顯示問卷 */
  function openAct(id, view, again) {
    var a = actById(id); if (!a) { U.closeDlg(); return; }
    if (S.single) document.title = (a.title || "未命名活動") + "｜新竹社會創新基地活動報名平台";
    if (view !== "reg" && view !== "fb") view = a.status === "feedback" ? "fb" : a.status === "open" ? "reg" : "";
    var d = U.dparts(a.date);
    S.view = view;
    var h = (S.single ? pageHead(a.title || "未命名活動") : U.head(a.title || "未命名活動")) +
      (a.image ? '<a class="poster" href="' + esc(a.image) + '" target="_blank" rel="noopener"><img src="' + esc(a.image) + '" alt="' + esc(a.title || "活動圖片") + '" onerror="this.parentNode.remove()"></a>' : "") +
      '<div class="tags"><span class="pill ' + esc(a.status) + '">' + esc(U.STATUS[a.status] || "") + '</span><span class="cnt">' + esc(U.capText(a, S.counts)) + "</span></div>" +
      '<dl class="meta"><dt>日期</dt><dd>' + esc(d.full) + "</dd>" +
      (a.time ? "<dt>時間</dt><dd>" + esc(a.time) + "</dd>" : "") +
      (a.location ? "<dt>地點</dt><dd>" + esc(a.location) + "</dd>" : "") +
      (a.semester ? "<dt>類別</dt><dd>" + esc(a.semester) + "</dd>" : "") + "</dl>" +
      (a.description ? '<p class="desc">' + esc(a.description) + "</p>" : "") +
      actBtns(a, view) + (S.single ? "" : '<p class="note page-link"><a href="?id=' + encodeURIComponent(a.id) + '">開啟這個活動的專屬網頁</a></p>') + "<hr>";

    if (view === "reg") h += regSection(a);
    else if (view === "fb") h += fbSection(a, again);
    else h += '<p class="note">這個活動已結束。</p>';
    show(h);
  }

  function regSection(a) {
    var id = a.id;
    var cancelBox = '<details><summary>已經報名，想取消？</summary><form id="cancel-form" data-id="' + esc(id) + '" style="margin-top:12px">' +
      '<div class="grid2">' + U.fld("c-sid", "報名時填寫的電話號碼", S.sid, true, "tel", ' maxlength="20" autocomplete="tel"') + U.fld("c-name", "報名時填寫的姓名", "", true, "text", ' maxlength="40"') + "</div>" +
      '<button class="btn danger" type="submit">取消報名</button></form></details>';
    if (a.status !== "open") return '<p class="note">這個活動目前沒有開放報名。</p>';
    var h = "";
    if (isFull(a)) h += '<div class="warn">這個活動已額滿。有人取消時，名額會重新開放。</div>';
    else h += '<form id="reg-form" class="survey" data-id="' + esc(id) + '" novalidate>' +
      U.fld("r-name", "您的姓名：", "", true, "text", ' maxlength="40" autocomplete="name"') +
      U.fld("r-sid", "您的電話號碼（僅做為聯繫用途）：", S.sid, true, "tel", ' maxlength="20" autocomplete="tel"') +
      U.fld("r-contact", "您的 Gmail（僅做為聯繫用途）：", "", true, "email", ' maxlength="80" autocomplete="email" placeholder="example@gmail.com"') +
      '<fieldset class="mrow" data-row="r-gender"><legend class="f"><span>性別： <i>*</i></span></legend><div class="choices">' + ["男性", "女性", "其他"].map(function (o) { return opt("r-gender", o); }).join("") + "</div></fieldset>" +
      '<fieldset class="mrow" data-row="r-age"><legend class="f"><span>您的年齡區間： <i>*</i></span></legend><div class="choices free">' + ["18歲以下", "19-25歲", "26-35歲", "36-45歲", "46-55歲", "56歲以上"].map(function (o) { return opt("r-age", o); }).join("") + "</div></fieldset>" +
      '<div class="f"><span>你要報名的課程：</span><div class="fixed">' + esc(a.title || "未命名活動") + "</div></div>" +
      '<label class="f" for="r-note"><span>有什麼想對我們說：</span><textarea id="r-note" maxlength="500"></textarea></label>' +
      '<button class="btn" type="submit">送出報名</button>' +
      '<p class="note">電話與 Gmail 僅做為聯繫用途。</p></form>';
    return h + "<hr>" + cancelBox;
  }

  function fbSection(a, again) {
    /* 這台裝置填過時先顯示感謝，但仍可再填一份（現場共用平板、或換人填寫時用） */
    if (a.status === "feedback") return fbDone(a.id) && !again ? '<div class="ok">這台裝置已經填過這個活動的回饋問卷，謝謝您！</div>' +
      '<button class="btn ghost" type="button" data-again="' + esc(a.id) + '">再填一份問卷</button>' : surveyForm(a.id);
    if (a.status === "open") return '<p class="note">回饋問卷會在活動結束後開放填寫，到時再回來這裡填寫即可。</p>';
    return '<p class="note">這個活動的回饋問卷已關閉。</p>';
  }

  function fbDone(id) { try { return localStorage.getItem("hub-fb-" + id) === "1"; } catch (e) { return false; } }
  function opt(name, v, type) {
    return '<label class="opt"><input type="' + (type || "radio") + '" name="' + esc(name) + '" value="' + esc(v) + '"><span>' + esc(v) + "</span></label>";
  }
  function surveyForm(id) {
    var n = 0, sv = U.surveyOf(actById(id));
    var h = '<form id="fb-form" class="survey" data-id="' + esc(id) + '" novalidate>' +
      '<h4 style="margin:0;font-size:1.125rem">' + esc(sv.title) + "</h4>" +
      (sv.intro ? '<div class="sv-intro"><p style="white-space:pre-line">' + esc(sv.intro) + "</p></div>" : "");
    sv.items.forEach(function (it) {
      if (it.type === "note") { h += '<div class="sv-note">' + esc(it.text) + "</div>"; return; }
      n++;
      h += '<fieldset class="sv-q" data-q="' + esc(it.id) + '"><legend class="sv-t"><b>' + n + "</b><span>" + esc(it.title) + (it.required ? " <i>*</i>" : "") + "</span></legend>";
      if (it.type === "single") h += '<div class="choices">' + it.options.map(function (o) { return opt(it.id, o); }).join("") + "</div>";
      else if (it.type === "multi") h += '<p class="note" style="margin:0">可複選，請選 ' + (it.minSel === it.maxSel ? it.minSel : it.minSel + "～" + it.maxSel) + " 項</p>" +
        '<div class="choices">' + it.options.map(function (o) { return opt(it.id, o, "checkbox"); }).join("") + "</div>";
      else if (it.type === "matrix") h += it.rows.map(function (r) {
        return '<fieldset class="mrow" data-row="' + esc(r.id) + '"><legend>' + esc(r.label) + '</legend><div class="choices" style="grid-template-columns:repeat(' + it.options.length + ',minmax(0,1fr))">' +
          it.options.map(function (o) { return opt(r.id, o); }).join("") + "</div></fieldset>";
      }).join("");
      else if (it.type === "text") h += '<textarea name="' + esc(it.id) + '" maxlength="1000" placeholder="請填入文字" aria-label="' + esc(it.title) + '"></textarea>';
      else if (it.type === "slider") h += '<div class="slider untouched"><input type="range" name="' + esc(it.id) + '" min="' + it.min + '" max="' + it.max + '" step="1" value="' + Math.round((it.min + it.max) / 2) + '" aria-label="' + esc(it.title) + '"><output>請拖曳選擇</output></div>' +
        '<div class="ends"><span>' + it.min + "</span><span>" + it.max + "</span></div>";
      h += "</fieldset>";
    });
    return h + '<button class="btn" type="submit">送出</button><p class="note">本問卷採不記名方式。</p></form>';
  }
  function collect(form) {
    var ans = {}, miss = null, sv = U.surveyOf(actById(form.dataset.id));
    form.querySelectorAll(".miss").forEach(function (el) { el.classList.remove("miss"); });
    U.surveyFields(sv).forEach(function (f) {
      var v = "", why = "";
      if (f.type === "scale" || f.type === "single") { var c = form.querySelector('input[name="' + f.key + '"]:checked'); v = c ? c.value : ""; }
      else if (f.type === "multi") {
        v = [].map.call(form.querySelectorAll('input[name="' + f.key + '"]:checked'), function (x) { return x.value; });
        if (v.length && (v.length < f.minSel || v.length > f.maxSel)) why = "請選擇 " + (f.minSel === f.maxSel ? f.minSel : f.minSel + "～" + f.maxSel) + " 個選項";
      }
      else if (f.type === "text") v = form.querySelector('[name="' + f.key + '"]').value.trim();
      else if (f.type === "slider") { var r = form.querySelector('[name="' + f.key + '"]'); v = r.closest(".slider").classList.contains("untouched") ? "" : r.value; }
      ans[f.key] = v;
      if (!why && f.required && (v === "" || (Array.isArray(v) && !v.length))) why = "請填寫";
      if (why) {
        var el = form.querySelector('[data-row="' + f.key + '"]') || form.querySelector('[data-q="' + f.key + '"]');
        if (el) { el.classList.add("miss"); var q = el.closest(".sv-q"); if (q) q.classList.add("miss"); }
        if (!miss) miss = { f: f, el: el, why: why };
      }
    });
    if (miss) {
      var label = "「" + (miss.f.group ? miss.f.group + "－" : "") + miss.f.head + "」";
      U.toast(miss.why === "請填寫" ? "請填寫" + label : label + miss.why);
      if (miss.el) miss.el.scrollIntoView({ block: "center", behavior: "smooth" });
      return null;
    }
    return ans;
  }

  function run(form, action, data, okMsg, after) {
    if (S.busy) return;
    S.busy = true;
    var btn = form.querySelector('button[type="submit"]'), label = btn.textContent;
    btn.disabled = true; btn.textContent = "處理中…";
    U.api(action, data).then(function (j) {
      U.toast(typeof okMsg === "function" ? okMsg(j) : okMsg);
      if (after) after();
      if (S.single) S.flash = typeof okMsg === "function" ? okMsg(j) : okMsg;
      return load().then(function () { if (!S.single) U.closeDlg(); else window.scrollTo({ top: 0, behavior: "smooth" }); });
    }, function (e) { U.toast(e.message); btn.disabled = false; btn.textContent = label; })
      .then(function () { S.busy = false; });
  }

  document.addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target, id = f.dataset.id;
    if (f.id === "reg-form") {
      var sid = $("r-sid").value.trim(), g = f.querySelector('input[name="r-gender"]:checked'), ag = f.querySelector('input[name="r-age"]:checked');
      var mail = $("r-contact").value.trim(), nm = $("r-name").value.trim();
      f.querySelectorAll(".miss").forEach(function (el) { el.classList.remove("miss"); });
      var bad = !nm ? ["r-name", "請填寫您的姓名"] : !sid ? ["r-sid", "請填寫您的電話號碼"] :
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail) ? ["r-contact", "請填寫正確的 Gmail"] :
        !g ? ["r-gender", "請選擇性別"] : !ag ? ["r-age", "請選擇年齡區間"] : null;
      if (bad) {
        U.toast(bad[1]);
        var el = $(bad[0]) || f.querySelector('[data-row="' + bad[0] + '"]');
        if (el) { if (el.dataset.row) el.classList.add("miss"); el.scrollIntoView({ block: "center", behavior: "smooth" }); if (el.focus && !el.dataset.row) el.focus(); }
        return;
      }
      run(f, "register", { activityId: id, studentId: sid, name: nm, contact: mail, gender: g.value, age: ag.value,
        note: $("r-note").value.trim() }, "報名成功！", function () { remember(sid); });
    } else if (f.id === "cancel-form") {
      run(f, "cancel", { activityId: id, studentId: $("c-sid").value.trim(), name: $("c-name").value.trim() }, "已取消報名。");
    } else if (f.id === "fb-form") {
      var ans = collect(f);
      if (!ans) return;
      run(f, "feedback", { activityId: id, answers: ans }, "已送出，感謝您的回饋！", function () {
        try { localStorage.setItem("hub-fb-" + id, "1"); } catch (x) {}
      });
    }
  });
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act],[data-view],[data-again],[data-close],[data-reload]");
    if (!t) { if (e.target === $("dlg")) U.closeDlg(); return; }
    if (t.dataset.act !== undefined) openAct(t.dataset.act);
    else if (t.dataset.view !== undefined) openAct(t.dataset.id, t.dataset.view);
    else if (t.dataset.again !== undefined) openAct(t.dataset.again, "fb", true);
    else if (t.dataset.close !== undefined) U.closeDlg();
    else { S.error = ""; render(); renderSingle(); load(); }
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "f-sem" || e.target.id === "f-status") render();
    var q = e.target.closest && e.target.closest(".miss");
    if (q && (e.target.type === "radio" || e.target.type === "checkbox")) { var row = e.target.closest(".mrow"); if (row) row.classList.remove("miss"); var sq = e.target.closest(".sv-q"); if (sq && !sq.querySelector(".mrow.miss")) sq.classList.remove("miss"); }
  });
  document.addEventListener("input", function (e) {
    if (e.target.type !== "range") return;
    var box = e.target.closest(".slider");
    box.classList.remove("untouched");
    box.querySelector("output").textContent = e.target.value + " 分";
    var sq = e.target.closest(".sv-q"); if (sq) sq.classList.remove("miss");
  });
  /* 直連：網址加上 #fb-活動編號 直接打開回饋問卷，#reg-活動編號 直接打開報名表，可做成 QR Code 放在現場 */
  function openFromHash() {
    var m = /^#(fb|reg)-([A-Za-z0-9]+)$/.exec(location.hash || "");
    if (m && actById(m[2])) { if (S.single && m[2] !== S.single) { location.href = "?id=" + m[2] + "&v=" + m[1]; return; } openAct(m[2], m[1]); }
  }
  window.addEventListener("hashchange", openFromHash);

  render();
  load().then(openFromHash);
})();
</script>
</body>
