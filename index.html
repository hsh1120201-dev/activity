<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新竹社會創新基地活動報名平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">HSINCHU SOCIAL INNOVATION HUB</div>
  </header>

  <main>
    <div class="hero">
      <h1>新竹社會創新基地<br><em>活動報名</em>平台</h1>
      <p>講座、工作坊與交流活動，都在這裡報名與填寫回饋。</p>
    </div>

    <section aria-labelledby="h-list">
      <div class="sec-head"><h2 id="h-list">近期活動</h2><small>點選活動即可查看與報名</small></div>
      <div class="filters">
        <label for="f-sem">類別<select id="f-sem"><option value="">全部類別</option></select></label>
        <label for="f-status">狀態<select id="f-status">
          <option value="">全部狀態</option><option value="open">報名中</option><option value="feedback">回饋中</option><option value="closed">已結束</option>
        </select></label>
      </div>
      <div id="list" class="list"><div class="panel"><p class="note">載入中…</p></div></div>
    </section>
  </main>
</div>

<dialog id="dlg" aria-labelledby="dlg-title"><div class="dlg" id="dlg-body"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="common.js"></script>
<script>
(function () {
  "use strict";
  var $ = U.$, esc = U.esc;
  var S = { acts: [], counts: {}, loaded: false, error: "", sid: "", busy: false };
  try { S.sid = localStorage.getItem("must-sid") || ""; } catch (e) {}

  function actById(id) { for (var i = 0; i < S.acts.length; i++) if (S.acts[i].id === id) return S.acts[i]; return null; }
  function isFull(a) { return a.capacity > 0 && (S.counts[a.id] || 0) >= a.capacity; }

  function actRow(a) {
    var d = U.dparts(a.date);
    var meta = [a.semester, a.time, a.location].filter(Boolean).map(esc).join(" · ");
    var chip = a.status === "open" && isFull(a) ? "額滿" : "";
    return '<button class="act" type="button" data-act="' + esc(a.id) + '">' +
      '<span class="date"><b>' + esc(d.md) + "</b><i>" + esc(d.wd) + "</i></span>" +
      '<span class="body"><span class="t">' + esc(a.title || "未命名活動") + "</span>" +
      (meta ? '<span class="m">' + meta + "</span>" : "") +
      '<span class="tags"><span class="pill ' + esc(a.status) + '">' + esc(U.STATUS[a.status] || "") + "</span>" +
      (chip ? '<span class="chip">' + chip + "</span>" : "") +
      '<span class="cnt">' + esc(U.capText(a, S.counts)) + "</span></span></span></button>";
  }

  function render() {
    var sel = $("f-sem"), cur = sel.value, sems = {};
    S.acts.forEach(function (a) { if (a.semester) sems[a.semester] = 1; });
    var keys = Object.keys(sems).sort().reverse();
    sel.innerHTML = '<option value="">全部類別</option>' + keys.map(function (k) { return '<option value="' + esc(k) + '">' + esc(k) + "</option>"; }).join("");
    if (keys.indexOf(cur) >= 0) sel.value = cur;
    var fs = sel.value, ft = $("f-status").value, list = $("list");

    if (!U.configured()) list.innerHTML = U.SETUP_NOTE;
    else if (S.error) list.innerHTML = '<div class="panel"><p class="note">' + esc(S.error) + '</p><p style="margin:10px 0 0"><button class="btn ghost sm" type="button" data-reload>重新載入</button></p></div>';
    else if (!S.loaded) list.innerHTML = '<div class="panel"><p class="note">載入中…</p></div>';
    else {
      var rows = U.sortActs(S.acts).filter(function (a) { return (!fs || a.semester === fs) && (!ft || a.status === ft); });
      list.innerHTML = rows.length ? rows.map(actRow).join("") :
        '<div class="panel"><p class="note">' + (S.acts.length ? "沒有符合條件的活動，試試其他類別或狀態。" : "目前還沒有活動。") + "</p></div>";
    }
  }

  function load() {
    if (!U.configured()) { render(); return Promise.resolve(); }
    return U.api("list").then(function (j) { S.acts = j.activities || []; S.counts = j.counts || {}; S.loaded = true; S.error = ""; render(); },
      function (e) { if (!S.loaded) S.error = e.message; render(); });
  }
  function remember(sid) { S.sid = sid; try { localStorage.setItem("must-sid", sid); } catch (e) {} }

  function openAct(id) {
    var a = actById(id); if (!a) { U.closeDlg(); return; }
    var d = U.dparts(a.date);
    var h = U.head(a.title || "未命名活動") +
      '<div class="tags"><span class="pill ' + esc(a.status) + '">' + esc(U.STATUS[a.status] || "") + '</span><span class="cnt">' + esc(U.capText(a, S.counts)) + "</span></div>" +
      '<dl class="meta"><dt>日期</dt><dd>' + esc(d.full) + "</dd>" +
      (a.time ? "<dt>時間</dt><dd>" + esc(a.time) + "</dd>" : "") +
      (a.location ? "<dt>地點</dt><dd>" + esc(a.location) + "</dd>" : "") +
      (a.semester ? "<dt>類別</dt><dd>" + esc(a.semester) + "</dd>" : "") + "</dl>" +
      (a.description ? '<p class="desc">' + esc(a.description) + "</p>" : "") + "<hr>";

    var cancelBox = '<details><summary>已經報名，想取消？</summary><form id="cancel-form" data-id="' + esc(id) + '" style="margin-top:12px">' +
      '<div class="grid2">' + U.fld("c-sid", "報名時填寫的電話號碼", S.sid, true, "tel", ' maxlength="20" autocomplete="tel"') + U.fld("c-name", "報名時填寫的姓名", "", true, "text", ' maxlength="40"') + "</div>" +
      '<button class="btn danger" type="submit">取消報名</button></form></details>';
    if (a.status === "open") {
      if (isFull(a)) h += '<div class="warn">這個活動已額滿。有人取消時，名額會重新開放。</div>';
      else h += '<form id="reg-form" class="survey" data-id="' + esc(id) + '" novalidate>' +
        U.fld("r-name", "您的姓名：", "", true, "text", ' maxlength="40" autocomplete="name"') +
        U.fld("r-sid", "您的電話號碼（僅做為聯繫用途）：", S.sid, true, "tel", ' maxlength="20" autocomplete="tel"') +
        U.fld("r-contact", "您的 Gmail（僅做為聯繫用途）：", "", true, "email", ' maxlength="80" autocomplete="email" placeholder="example@gmail.com"') +
        '<fieldset class="mrow" data-row="r-gender"><legend class="f"><span>性別： <i>*</i></span></legend><div class="choices">' + ["男性", "女性", "其他"].map(function (o) { return opt("r-gender", o); }).join("") + "</div></fieldset>" +
        '<fieldset class="mrow" data-row="r-age"><legend class="f"><span>您的年齡區間： <i>*</i></span></legend><div class="choices free">' + ["18歲以下", "18-25歲", "25-35歲", "35-45歲", "45-55歲", "55歲以上"].map(function (o) { return opt("r-age", o); }).join("") + "</div></fieldset>" +
        '<div class="f"><span>你要報名的課程：</span><div class="fixed">' + esc(a.title || "未命名活動") + "</div></div>" +
        '<label class="f" for="r-note"><span>有什麼想對我們說：</span><textarea id="r-note" maxlength="500"></textarea></label>' +
        '<button class="btn" type="submit">送出報名</button>' +
        '<p class="note">電話與 Gmail 僅做為聯繫用途。</p></form>';
      h += "<hr>" + cancelBox;
    } else if (a.status === "feedback") {
      h += fbDone(id) ? '<div class="ok">感謝您填寫課程滿意度調查！</div>' : surveyForm(id);
    } else {
      h += '<p class="note">這個活動已結束。</p>';
    }
    U.showDlg(h);
  }

  function fbDone(id) { try { return localStorage.getItem("hub-fb-" + id) === "1"; } catch (e) { return false; } }
  function opt(name, v) {
    return '<label class="opt"><input type="radio" name="' + esc(name) + '" value="' + esc(v) + '"><span>' + esc(v) + "</span></label>";
  }
  function surveyForm(id) {
    var n = 0, sv = U.SURVEY;
    var h = '<form id="fb-form" class="survey" data-id="' + esc(id) + '" novalidate>' +
      '<h4 style="margin:0;font-size:18px">' + esc(sv.title) + "</h4>" +
      '<div class="sv-intro"><p>' + esc(sv.intro) + '</p><p class="note">' + esc(sv.contact).replace(/\n/g, "<br>") + "</p></div>";
    sv.items.forEach(function (it) {
      if (it.type === "note") { h += '<div class="sv-note">' + esc(it.text) + "</div>"; return; }
      n++;
      var key = it.key || "m" + n;
      h += '<fieldset class="sv-q" data-q="' + esc(key) + '"><legend class="sv-t"><b>' + n + "</b><span>" + esc(it.title) + (it.required ? " <i>*</i>" : "") + "</span></legend>";
      if (it.type === "single") h += '<div class="choices">' + it.options.map(function (o) { return opt(it.key, o); }).join("") + "</div>";
      else if (it.type === "matrix") h += it.rows.map(function (r) {
        return '<fieldset class="mrow" data-row="' + esc(r.key) + '"><legend>' + esc(r.label) + '</legend><div class="choices">' + U.SCALE.map(function (o) { return opt(r.key, o); }).join("") + "</div></fieldset>";
      }).join("");
      else if (it.type === "text") h += '<textarea name="' + esc(it.key) + '" maxlength="1000" placeholder="請填入文字" aria-label="' + esc(it.title) + '"></textarea>';
      else if (it.type === "slider") h += '<div class="slider untouched"><input type="range" name="' + esc(it.key) + '" min="' + it.min + '" max="' + it.max + '" step="1" value="' + Math.round((it.min + it.max) / 2) + '" aria-label="' + esc(it.title) + '"><output>請拖曳選擇</output></div>' +
        '<div class="ends"><span>' + it.min + "</span><span>" + it.max + "</span></div>";
      h += "</fieldset>";
    });
    return h + '<button class="btn" type="submit">送出</button><p class="note">本問卷採不記名方式。</p></form>';
  }
  function collect(form) {
    var ans = {}, miss = null;
    form.querySelectorAll(".miss").forEach(function (el) { el.classList.remove("miss"); });
    U.surveyFields().forEach(function (f) {
      var v = "";
      if (f.type === "scale" || f.type === "single") { var c = form.querySelector('input[name="' + f.key + '"]:checked'); v = c ? c.value : ""; }
      else if (f.type === "text") v = form.querySelector('[name="' + f.key + '"]').value.trim();
      else if (f.type === "slider") { var r = form.querySelector('[name="' + f.key + '"]'); v = r.closest(".slider").classList.contains("untouched") ? "" : r.value; }
      ans[f.key] = v;
      if (f.required && v === "") {
        var el = form.querySelector('[data-row="' + f.key + '"]') || form.querySelector('[data-q="' + f.key + '"]');
        if (el) { el.classList.add("miss"); var q = el.closest(".sv-q"); if (q) q.classList.add("miss"); }
        if (!miss) miss = { f: f, el: el };
      }
    });
    if (miss) {
      U.toast("請填寫「" + (miss.f.group ? miss.f.group + "－" : "") + miss.f.head + "」");
      if (miss.el) miss.el.scrollIntoView({ block: "center", behavior: "smooth" });
      return null;
    }
    return ans;
  }

  function run(form, action, data, okMsg, after) {
    if (S.busy) return;
    S.busy = true;
    var btn = form.querySelector('button[type="submit"]'), label = btn.textContent;
    btn.disabled = true; btn.textContent = "處理中…";
    U.api(action, data).then(function () {
      U.toast(okMsg);
      if (after) after();
      return load().then(function () { U.closeDlg(); });
    }, function (e) { U.toast(e.message); btn.disabled = false; btn.textContent = label; })
      .then(function () { S.busy = false; });
  }

  document.addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target, id = f.dataset.id;
    if (f.id === "reg-form") {
      var sid = $("r-sid").value.trim(), g = f.querySelector('input[name="r-gender"]:checked'), ag = f.querySelector('input[name="r-age"]:checked');
      var mail = $("r-contact").value.trim(), nm = $("r-name").value.trim();
      f.querySelectorAll(".miss").forEach(function (el) { el.classList.remove("miss"); });
      var bad = !nm ? ["r-name", "請填寫您的姓名"] : !sid ? ["r-sid", "請填寫您的電話號碼"] :
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail) ? ["r-contact", "請填寫正確的 Gmail"] :
        !g ? ["r-gender", "請選擇性別"] : !ag ? ["r-age", "請選擇年齡區間"] : null;
      if (bad) {
        U.toast(bad[1]);
        var el = $(bad[0]) || f.querySelector('[data-row="' + bad[0] + '"]');
        if (el) { if (el.dataset.row) el.classList.add("miss"); el.scrollIntoView({ block: "center", behavior: "smooth" }); if (el.focus && !el.dataset.row) el.focus(); }
        return;
      }
      run(f, "register", { activityId: id, studentId: sid, name: nm, contact: mail, gender: g.value, age: ag.value,
        note: $("r-note").value.trim() }, "報名成功。", function () { remember(sid); });
    } else if (f.id === "cancel-form") {
      run(f, "cancel", { activityId: id, studentId: $("c-sid").value.trim(), name: $("c-name").value.trim() }, "已取消報名。");
    } else if (f.id === "fb-form") {
      var ans = collect(f);
      if (!ans) return;
      run(f, "feedback", { activityId: id, answers: ans }, "已送出，感謝您的回饋！", function () {
        try { localStorage.setItem("hub-fb-" + id, "1"); } catch (x) {}
      });
    }
  });
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act],[data-close],[data-reload]");
    if (!t) { if (e.target === $("dlg")) U.closeDlg(); return; }
    if (t.dataset.act !== undefined) openAct(t.dataset.act);
    else if (t.dataset.close !== undefined) U.closeDlg();
    else { S.error = ""; render(); load(); }
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "f-sem" || e.target.id === "f-status") render();
    var q = e.target.closest && e.target.closest(".miss");
    if (q && e.target.type === "radio") { var row = e.target.closest(".mrow"); if (row) row.classList.remove("miss"); var sq = e.target.closest(".sv-q"); if (sq && !sq.querySelector(".mrow.miss")) sq.classList.remove("miss"); }
  });
  document.addEventListener("input", function (e) {
    if (e.target.type !== "range") return;
    var box = e.target.closest(".slider");
    box.classList.remove("untouched");
    box.querySelector("output").textContent = e.target.value + " 分";
    var sq = e.target.closest(".sv-q"); if (sq) sq.classList.remove("miss");
  });
  /* 回饋問卷直連：網址加上 #fb-活動編號 會直接打開該活動的問卷，可做成 QR Code 放在現場 */
  function openFromHash() {
    var m = /^#fb-([A-Za-z0-9]+)$/.exec(location.hash || "");
    if (m && actById(m[1])) openAct(m[1]);
  }
  window.addEventListener("hashchange", openFromHash);

  render();
  load().then(openFromHash);
})();
</script>
</body>
</html>
